
spring.datasource.url=jdbc:postgresql://localhost:5432/transactions
spring.datasource.username=app
spring.datasource.password=app

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
spring.application.name=financial-transaction-system
stripe.secret-key=${STRIPE_SECRET_KEY}
spring.security.user.name=${FINPAY_API_USER}
spring.security.user.password=${FINPAY_API_PASSWORD}
spring.security.user.roles=API_USER
